# Encje TeslaMate przez MQTT (TeslaMate nie publikuje MQTT Discovery).
# Zakłada car_id 1: teslamate/cars/1/...  Dla innego auta zamień "cars/1" w całym pliku.

sensor:
  - name: "Tesla poziom baterii"
    unique_id: tesla_battery_level
    default_entity_id: sensor.tesla_tesla_poziom_baterii
    state_topic: "teslamate/cars/1/battery_level"
    unit_of_measurement: "%"
    device_class: battery
    state_class: measurement
    device: &tesla_device
      identifiers: ["teslamate_car_1"]
      name: "Tesla"
      manufacturer: "Tesla"
      model: "Model 3"

  - name: "Tesla zasięg"
    unique_id: tesla_est_range
    default_entity_id: sensor.tesla_tesla_zasieg
    state_topic: "teslamate/cars/1/est_battery_range_km"
    unit_of_measurement: "km"
    device_class: distance
    state_class: measurement
    device: *tesla_device

  - name: "Tesla stan"
    unique_id: tesla_state
    default_entity_id: sensor.tesla_tesla_stan
    state_topic: "teslamate/cars/1/state"
    device: *tesla_device

  - name: "Tesla stan ładowania"
    unique_id: tesla_charging_state
    default_entity_id: sensor.tesla_tesla_stan_ladowania
    state_topic: "teslamate/cars/1/charging_state"
    device: *tesla_device

  - name: "Tesla przebieg"
    unique_id: tesla_odometer
    default_entity_id: sensor.tesla_tesla_przebieg
    state_topic: "teslamate/cars/1/odometer"
    unit_of_measurement: "km"
    device_class: distance
    state_class: total_increasing
    device: *tesla_device

  - name: "Tesla temperatura zewnętrzna"
    unique_id: tesla_outside_temp
    default_entity_id: sensor.tesla_tesla_temperatura_zewnetrzna
    state_topic: "teslamate/cars/1/outside_temp"
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    device: *tesla_device

  - name: "Tesla temperatura wewnętrzna"
    unique_id: tesla_inside_temp
    default_entity_id: sensor.tesla_tesla_temperatura_wewnetrzna
    state_topic: "teslamate/cars/1/inside_temp"
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    device: *tesla_device

  - name: "Tesla lokalizacja (geofence)"
    unique_id: tesla_geofence
    default_entity_id: sensor.tesla_tesla_lokalizacja_geofence
    state_topic: "teslamate/cars/1/geofence"
    device: *tesla_device

  # --- Rozszerzone ---
  - name: "Bieg"
    unique_id: tesla_shift_state
    default_entity_id: sensor.tesla_shift_state
    state_topic: "teslamate/cars/1/shift_state"
    device: *tesla_device

  - name: "Prędkość"
    unique_id: tesla_speed
    default_entity_id: sensor.tesla_speed
    state_topic: "teslamate/cars/1/speed"
    unit_of_measurement: "km/h"
    device_class: speed
    state_class: measurement
    value_template: "{% if value in ['nil','(null)','null',''] %}None{% else %}{{ value }}{% endif %}"
    device: *tesla_device

  - name: "Moc chwilowa"
    unique_id: tesla_power
    default_entity_id: sensor.tesla_power
    state_topic: "teslamate/cars/1/power"
    unit_of_measurement: "kW"
    device_class: power
    state_class: measurement
